apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopnow-demo
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 951066974787.dkr.ecr.ap-southeast-2.amazonaws.com/project4-shopnow/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        # Pass both MONGODB_URI and MONGO_URI so whichever the code expects is populated
        - name: MONGODB_URI
          value: "mongodb://mongo:27017/shopnow"
        - name: MONGO_URI
          value: "mongodb://mongo:27017/shopnow"
        - name: PORT
          value: "5000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: shopnow-demo
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: shopnow-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
